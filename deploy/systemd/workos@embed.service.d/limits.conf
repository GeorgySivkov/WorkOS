# Ночной бэкфилл эмбеддингов: модель держит 400-500 МБ, дроплет 1 ГБ.
# MemoryHigh тормозит (своп), MemoryMax убивает только этот прогон, а не бота.
# Прогон сам останавливается через 40 минут (workctl embed --max-minutes), остальное в следующую ночь.
[Service]
MemoryHigh=600M
MemoryMax=800M
TimeoutStartSec=70min
Nice=10
